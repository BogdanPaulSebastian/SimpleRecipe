plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'net.paulbogdan.simplerecipe'
    compileSdk 33

    defaultConfig {
        applicationId "net.paulbogdan.simplerecipe"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

    }

    buildTypes {

        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-DEV"
            resValue "string", "app_name", "Simple Recipe Debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def keystorePropertiesFile = rootProject.file("keystore_dev.properties")
            def keystoreProperties = new Properties()
            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

            buildConfigField "String", "BASE_API_URL", keystoreProperties["BASE_API_URL"]
            buildConfigField "String", "API_ID", keystoreProperties["API_ID"]
            buildConfigField "String", "API_KEY", keystoreProperties["API_KEY"]
            buildConfigField "String", "BANNER_ID", keystoreProperties["BANNER_ID"]
            buildConfigField "String", "INTERSTITIAL_ID", keystoreProperties["INTERSTITIAL_ID"]
        }


        release {
            debuggable false
            minifyEnabled true
            resValue "string", "app_name", "Simple Recipe"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def keystorePropertiesFile = rootProject.file("keystore_prod.properties")
            def keystoreProperties = new Properties()
            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

            buildConfigField "String", "BASE_API_URL", keystoreProperties["BASE_API_URL"]
            buildConfigField "String", "API_ID", keystoreProperties["API_ID"]
            buildConfigField "String", "API_KEY", keystoreProperties["API_KEY"]
            buildConfigField "String", "BANNER_ID", keystoreProperties["BANNER_ID"]
            buildConfigField "String", "INTERSTITIAL_ID", keystoreProperties["INTERSTITIAL_ID"]

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.1.1'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.activity:activity-compose:1.3.1'
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation 'androidx.compose.material:material:1.1.1'
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.27.0"
    implementation "com.google.accompanist:accompanist-navigation-animation:0.23.1"
    implementation "com.google.accompanist:accompanist-webview:0.24.4-alpha"
    implementation 'com.google.android.play:review-ktx:2.0.1'

    // ViewModel Compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.0-alpha03'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.4.0"

    // Dagger - Hilt
    implementation "com.google.dagger:hilt-android:2.44"
    implementation "androidx.hilt:hilt-navigation-compose:1.0.0"
    kapt "com.google.dagger:hilt-android-compiler:2.44"

    // RxJava
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'

    //Glide
    implementation "com.github.bumptech.glide:compose:1.0.0-alpha.1"

    //AdMob
    implementation 'com.google.android.gms:play-services-ads:21.5.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"
}

kapt {
    correctErrorTypes = true
}